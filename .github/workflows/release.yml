name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            platform: linux-x64
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            platform: macos-arm64
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            platform: windows-x64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/rkdevcli" staging/
          cp "target/${{ matrix.target }}/release/rkdev-maintenance" staging/
          cp LICENSE README.md staging/
          tar -czf "rkdevcli-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C staging .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staging
          Copy-Item "target/${{ matrix.target }}/release/rkdevcli.exe" staging
          Copy-Item "target/${{ matrix.target }}/release/rkdev-maintenance.exe" staging
          Copy-Item LICENSE, README.md staging
          Compress-Archive -Path staging/* -DestinationPath "rkdevcli-$env:GITHUB_REF_NAME-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rkdevcli-${{ matrix.platform }}
          path: rkdevcli-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum rkdevcli-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "rkdevcli $GITHUB_REF_NAME" --generate-notes
